services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-rpa}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-rpa_dev_password}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://rpa:rpa_dev_password@mongo:27017/rapid_prototype_assistant?authSource=admin}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./package.json:/app/package.json
      - api_node_modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json
      - web_node_modules:/app/node_modules

volumes:
  mongo_data:
  api_node_modules:
  web_node_modules:
